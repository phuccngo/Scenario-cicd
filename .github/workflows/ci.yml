
name: Scenario CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository chứa workflow
      - name: Checkout CI repository
        uses: actions/checkout@v6

      # 2. Checkout repository ứng dụng
      - name: Checkout Scenario application
        uses: actions/checkout@v6
        with:
          repository: ELCOM-PRIME/Scenario
          ref: phucnt
          token: ${{ secrets.SCENARIO_REPO_TOKEN }}
          path: scenario

      # 3. Cài Python
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: scenario/requirements.txt

      # 4. Cài thư viện hệ thống
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            libpq-dev

      # 5. Cài Python dependencies
      - name: Install Python dependencies
        working-directory: scenario
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 6. Kiểm tra cú pháp Python
      - name: Compile Python files
        working-directory: scenario
        run: |
          python -m compileall -q .
