
name: Scenario CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: scenario

    steps:
      # 1. Checkout CI/CD repository
      - name: Checkout CI repository
        uses: actions/checkout@v6

      # 2. Checkout application repository (read-only)
      - name: Checkout Scenario application
        uses: actions/checkout@v6
        with:
          repository: ELCOM-PRIME/Scenario
          ref: phucnt
          token: ${{ secrets.SCENARIO_REPO_TOKEN }}
          path: scenario
          persist-credentials: false

      # 3. Setup Python and cache dependencies
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            scenario/requirements.txt
            requirements-test.txt

      # 4. Install system dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libpq-dev

      # 5. Install application dependencies
      - name: Install application dependencies
        working-directory: scenario
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 6. Install testing dependencies
      - name: Install testing dependencies
        run: |
          python -m pip install -r requirements-test.txt

      # 7. Validate Python syntax
      - name: Compile Python source
        working-directory: scenario
        run: |
          python -m compileall -q .

      # 8. Run backend tests
      - name: Run backend tests
        run: |
           python -m pytest -c config/pytest.ini tests/backend -v
