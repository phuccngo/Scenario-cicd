apiVersion: v1
kind: Pod
spec:
  containers:
    - name: python
      image: python:3.10-slim
      command:
        - cat
      tty: true
      volumeMounts:
        - name: github-known-hosts
          mountPath: /etc/ssh/ssh_known_hosts
          subPath: known_hosts
          readOnly: true

    - name: jnlp
      image: jenkins/inbound-agent:3391.va_37fa_a_305d6d-1-jdk25
      volumeMounts:
        - name: github-known-hosts
          mountPath: /home/jenkins/.ssh/known_hosts
          subPath: known_hosts
          readOnly: true

  volumes:
    - name: github-known-hosts
      secret:
        secretName: github-known-hosts